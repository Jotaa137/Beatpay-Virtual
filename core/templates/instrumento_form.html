{% load static %}<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ modo }} instrumento - BeatPay</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{% static 'core/css/style.css' %}?v=5"></head>
<body class="d-flex flex-column min-vh-100">
<nav class="navbar"><div class="container-fluid px-4" style="display:flex;align-items:center;gap:10px"><a class="navbar-brand logo" href="{% url 'index' %}">BEATPAY <span>VIRTUAL</span></a><div class="d-flex gap-2 align-items-center" style="margin-left:auto"><a class="btn btn-secondary btn-sm" href="{% url 'panel' %}">Panel</a><a class="btn btn-outline-secondary btn-sm" href="{% url 'panel_instrumentos' %}">Instrumentos</a><a class="btn btn-outline-secondary btn-sm" href="{% url 'logout' %}">Cerrar sesión</a></div></div></nav>
<main class="container py-4" style="max-width:720px">
<div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
<h2 class="h4 mb-0">{{ modo }} instrumento</h2>
<a class="btn btn-outline-secondary btn-sm" href="{% url 'panel_instrumentos' %}">Volver</a>
</div>
{% if messages %}{% for m in messages %}<div class="alert alert-{{ m.tags|default:'info' }}">{{ m }}</div>{% endfor %}{% endif %}
<div class="card bp-card"><div class="card-body p-4">
<form method="post" class="row g-3">{% csrf_token %}
<div class="col-6"><label class="form-label">Tipo</label><select name="tipo" class="form-select bp-input" required id="id_tipo">{% for codigo, nombre in tipos %}<option value="{{ codigo }}" {% if valores.tipo == codigo %}selected{% endif %}>{{ nombre }}</option>{% endfor %}</select></div>
<div class="col-6"><label class="form-label">Banco</label><select name="banco" class="form-select bp-input" required><option value="">Seleccionar banco</option>{% for b in bancos %}<option value="{{ b.id }}" {% if valores.banco == b.id|stringformat:'s' %}selected{% endif %}>{{ b.nombre }} ({{ b.codigo }})</option>{% endfor %}</select></div>
<div class="col-6" id="campo_tarjeta" {% if valores.tipo != 'INTERNO' %}style="display:none"{% endif %}><label class="form-label">Tarjeta (solo interno)</label><select name="tarjeta" class="form-select bp-input"><option value="">Seleccionar tarjeta</option>{% for t in tarjetas %}<option value="{{ t.id }}" {% if valores.tarjeta == t.id|stringformat:'s' %}selected{% endif %}>{{ t.numero }} - {{ t.cliente.nombre }} {{ t.cliente.apellido }}</option>{% endfor %}</select></div>
<div class="col-6"><label class="form-label">Titular</label><input name="titular" class="form-control bp-input" maxlength="120" value="{{ valores.titular }}"></div>
<div class="col-6"><label class="form-label">Alias</label><input name="alias" class="form-control bp-input" maxlength="60" value="{{ valores.alias }}"></div>
<div class="col-12"><div class="form-check"><input name="activo" class="form-check-input" type="checkbox" id="activo" {% if valores.activo %}checked{% endif %}><label class="form-check-label" for="activo">Instrumento activo</label></div></div>
<div class="col-12 d-flex gap-2"><button class="btn btn-beatpay" type="submit">Guardar</button><a class="btn btn-outline-secondary" href="{% url 'panel_instrumentos' %}">Cancelar</a></div>
</form>
</div></div>
</main>
<script>
document.getElementById('id_tipo').addEventListener('change', function () {
    document.getElementById('campo_tarjeta').style.display = this.value === 'INTERNO' ? '' : 'none';
});
</script>
<script src="{% static 'core/js/app.js' %}?v=5"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body></html>
