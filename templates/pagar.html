{% load static %}<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pagar - BeatPay</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{% static 'css/style.css' %}"></head>
<body class="d-flex flex-column min-vh-100">
<nav class="navbar"><div class="container-fluid px-4" style="display:flex;align-items:center;gap:10px"><a class="navbar-brand logo" href="index">BEATPAY <span>VIRTUAL</span></a><div class="d-flex gap-2 align-items-center" style="margin-left:auto"><a class="btn btn-secondary btn-sm" href="dashboard">Mi cuenta</a><a class="btn btn-outline-secondary btn-sm" href="logout">Salir</a></div></div></nav>
<main class="container py-5" style="max-width:520px"><div class="card bp-card"><div class="card-body p-4">
<h2 class="h4">Realizar pago</h2><p class="bp-muted">Saldo: <b id="saldo"></b> | Tarjeta: <b id="tarj"></b></p>
<div id="err" class="alert alert-danger d-none"></div><div id="ok" class="alert alert-success d-none"></div>
<form onsubmit="return pagar(event)">
<label class="form-label">Evento / Comercio</label>
<select id="evento" class="form-select bp-input mb-3">{% for e in eventos %}<option>{{ e }}</option>{% endfor %}</select>
<label class="form-label">Monto (mín. ${{ monto_min }})</label><input id="monto" class="form-control bp-input mb-3" type="number" min="{{ monto_min }}" value="{{ monto_default }}" required>
<button class="btn btn-beatpay w-100 mb-2" type="submit">Pagar</button>
<a class="btn btn-secondary w-100" href="dashboard">Volver</a></form>
</div></div>
<div id="boleta" class="card bp-card mt-3 d-none"><div class="card-body p-4">
<h5>Boleta BeatPay</h5>
<p class="mb-1">Folio: <b id="b-folio"></b> | Fecha: <b id="b-fecha"></b></p>
<p class="mb-1">Operación: <b id="b-tipo"></b> | Evento: <b id="b-evento"></b></p>
<p class="mb-1">Monto: <b id="b-monto"></b></p>
<p class="mb-1">Saldo anterior: <b id="b-antes"></b> → Nuevo: <b id="b-nuevo"></b></p>
<div class="d-flex flex-wrap gap-2 mt-2"><button class="btn btn-secondary" onclick="window.print()">Imprimir</button><button class="btn btn-outline-secondary" onclick="return descargarBoleta()">Descargar .txt</button></div>
</div></div></main>
<script src="{% static 'js/app.js' %}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body></html>
