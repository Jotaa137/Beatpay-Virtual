<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Registro - BeatPay</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>try{document.documentElement.setAttribute('data-theme',localStorage.getItem('beatpay_theme')||'dark')}catch(e){}</script>
<link rel="stylesheet" href="../static/css/style.css?v=3"></head>
<body class="bg-[#0f0f1a] text-white min-h-screen">
<nav class="navbar navbar-dark bg-black bg-opacity-50 border-bottom border-light border-opacity-10"><div class="container-fluid px-4" style="display:flex;align-items:center;gap:10px"><a class="navbar-brand logo" href="index.html">BEATPAY <span>VIRTUAL</span></a><div class="d-flex gap-2 align-items-center" style="margin-left:auto"><a class="btn btn-secondary btn-sm" href="index.html">Inicio</a><a class="btn btn-beatpay btn-sm" href="login.html">Entrar</a></div></div></nav>
<main class="container py-5" style="max-width:520px"><div class="card bp-card"><div class="card-body p-4">
<h2 class="h4">Crear cuenta</h2><p class="bp-muted">Cuenta digital + tarjeta virtual automática</p>
<form onsubmit="return doReg(event)">
<label class="form-label">Nombre</label><input id="nombre" class="form-control bp-input mb-3" required placeholder="Juan Pérez">
<label class="form-label">Email</label><input id="email" class="form-control bp-input mb-3" type="email" required>
<label class="form-label">Contraseña (mín. {{ min_pass }} caracteres)</label><div class="input-group mb-3"><input id="pass" class="form-control bp-input" type="password" required minlength="6"><button class="btn btn-secondary" type="button" onclick="return verPass('pass',this)" title="Mostrar/ocultar">👁</button></div>
<label class="form-label">Presupuesto para eventos</label><input id="pto" class="form-control bp-input mb-1" type="number" min="0" placeholder="Ej: {{ presupuesto_default }}">
<p class="bp-muted mb-3" style="font-size:.8rem">Opcional. Si lo dejas vacío se usa $100.000 de ejemplo.</p>
<button class="btn btn-beatpay w-100" type="submit">Registrarme</button>
</form></div></div></main>
<div id="bp-toast" class="alert d-none container mt-3" style="max-width:520px"></div>
<script src="../static/js/app.js?v=3"></script>
<script src="../static/js/auth.js?v=3"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body></html>
