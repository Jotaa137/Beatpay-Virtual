{% load static %}<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tarjeta - BeatPay</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{% static 'css/style.css' %}"></head>
<body class="d-flex flex-column min-vh-100">
<nav class="navbar"><div class="container-fluid px-4" style="display:flex;align-items:center;gap:10px"><a class="navbar-brand logo" href="index">BEATPAY <span>VIRTUAL</span></a><div class="d-flex gap-2 align-items-center" style="margin-left:auto"><a class="btn btn-secondary btn-sm" href="dashboard">Mi cuenta</a><a class="btn btn-outline-secondary btn-sm" href="logout">Salir</a></div></div></nav>
<main class="container py-5" style="max-width:520px"><div class="card bp-card"><div class="card-body p-4">
<h2 class="h4">Tarjeta virtual</h2>
<div class="tarjeta-visual"><div class="d-flex justify-content-between align-items-center"><span class="tv-marca">BEATPAY VIRTUAL {{ tipo }}</span><span class="badge text-bg-light">{{ tipo }}</span></div><div class="num">**** **** **** 1234</div><div class="d-flex align-items-center gap-2">{% if tarjeta == 'Activa' %}<span id="badge" class="badge text-bg-success">Activa</span>{% else %}<span id="badge" class="badge text-bg-danger">{{ tarjeta }}</span>{% endif %}</div></div>
<p class="bp-muted">Vinculada a tu cuenta digital. Solo Activa permite pagar.</p>
<button class="btn btn-beatpay w-100 mb-2" id="btnToggle" onclick="toggle()">Bloquear tarjeta</button>
<a class="btn btn-secondary w-100" href="dashboard">Volver</a>
</div></div></main>
<script src="{% static 'js/app.js' %}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body></html>
