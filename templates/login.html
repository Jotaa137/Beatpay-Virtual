{% load static %}<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login - BeatPay</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{% static 'css/style.css' %}"></head>
<body class="d-flex flex-column min-vh-100">
<nav class="navbar"><div class="container-fluid px-4" style="display:flex;align-items:center;gap:10px"><a class="navbar-brand logo" href="index">BEATPAY <span>VIRTUAL</span></a><div class="d-flex gap-2 align-items-center" style="margin-left:auto"><a class="btn btn-secondary btn-sm" href="index">Inicio</a><a class="btn btn-beatpay btn-sm" href="register">Registro</a></div></div></nav>
<main class="container py-5" style="max-width:480px"><div class="card bp-card"><div class="card-body p-4">
<h2 class="h4">Iniciar sesión</h2><p class="bp-muted">Acceso seguro</p>
<div id="msg" class="alert alert-danger d-none"></div>
<form onsubmit="return doLogin(event)">
<label class="form-label">Email</label><input id="email" class="form-control bp-input mb-3" type="email" required placeholder="{{ demo_email }}">
<label class="form-label">Contraseña</label><div class="input-group mb-3"><input id="pass" class="form-control bp-input" type="password" required placeholder="••••••••"><button class="btn btn-secondary" type="button" onclick="return verPass('pass',this)" title="Mostrar/ocultar">👁</button></div>
<button class="btn btn-beatpay w-100" type="submit">Entrar</button>
</form>
<p class="bp-muted mt-3 mb-0">¿No tienes cuenta? <a href="register" class="link-primary">Regístrate</a> | <a href="dashboard" class="link-secondary">Ver cuenta</a></p>
</div></div></main>
<script src="{% static 'js/app.js' %}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body></html>
